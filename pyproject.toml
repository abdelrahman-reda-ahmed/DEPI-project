[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dora-pentest"
version = "0.3.0"
description = "Automated reconnaissance and pentesting assistant"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "dnspython>=2.4.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "tqdm>=4.66.0",
]

[project.urls]
Homepage = "https://github.com/dora-recon/dora"
Repository = "https://github.com/dora-recon/dora"

[project.scripts]
dora = "dora.cli:app"
dora-gui = "dora.gui:main"

[tool.setuptools.packages.find]
include = ["dora*"]

[tool.setuptools.package-data]
dora = ["py.typed"]
