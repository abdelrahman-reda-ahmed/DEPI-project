# DORA Configuration
# API keys — set these in environment variables or here

api_keys:
  securitytrails: ""        # https://securitytrails.com/api (free: 50 req/mo)
  virustotal: ""            # https://virustotal.com (free: 500 req/day)
  shodan: ""                # https://shodan.io (free: 1 req/sec)
  builtwith: ""             # https://builtwith.com (paid)
  github: ""                # GitHub token for repo scanning

scan:
  threads: 20
  timeout: 10
  retries: 2
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) DORA/0.2"
  rate_limit: 0.1           # delay between requests (seconds)
  phase_timeout: 0          # max seconds per phase (0 = no limit)

port_scan:
  ports: "21,22,23,25,53,80,110,143,443,445,993,995,1433,1521,2049,3306,3389,5432,5900,6379,8080,8443,9000,27017"
  timing_template: "T4"     # nmap timing: T0-T5

wordlists:
  subdomains: "wordlists/subdomains.txt"           # 5,016 entries (SecLists top 5k + original)
  subdomains_large: "wordlists/subdomains_deepmagic.txt"  # 49,928 entries (deepmagic prefixes)
  directories: "wordlists/directories.txt"         # 4,649 entries (SecLists common + original)
  parameters: "wordlists/parameters.txt"           # 6,453 entries (SecLists burp param names)

output:
  format: "json"            # json, html, md
  dir: "reports/"
  verbose: false
